name: ehrenamtjustiz
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 60s
  retries: 3
  start_period: 60s

x-security-settings: &security_settings
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17.5-alpine3.20@sha256:ccd14e0306cef4c2943a4bda5a2c6a77201a426eb2576d888e5cdc28ccddca75
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -d postgres -U admin"]
    <<: *security_settings

  # see https://event-driven.io/en/automatically_connect_pgadmin_to_database/
  pg-admin:
    image: dpage/pgadmin4:9.15.0@sha256:cefc4cc6b7d9d71a9e81e76fb9d7e14038ab5661b539a190eea1b63fa612589a
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
      # pgAdmin Boolean environment variables always have to be passed as "True" / "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/preferences.json:/pgadmin4/preferences.json:ro
      - ./pgadmin/pgpass:/tmp/pgpass.mounted:ro
      - ./pgadmin/data:/tmp/data
    entrypoint: >
      /bin/sh -c "
        cp -f /tmp/pgpass.mounted /tmp/pgpass;
        chmod 600 /tmp/pgpass;
        /entrypoint.sh
      "
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-O", "-", "http://localhost:5050/misc/ping"]
    <<: *security_settings

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8100
      KC_HTTP_RELATIVE_PATH: /auth
    ports:
      - "8100:8100"
    volumes:
      - ./keycloak/plugins:/opt/keycloak/providers/
    networks:
      - keycloak
    healthcheck:
      <<: *healthcheck
      test: [
        "CMD-SHELL",
        # health check see https://www.keycloak.org/observability/health#_healthcheck
        "{ printf 'HEAD /auth/health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      ]
    <<: *security_settings

  init-keycloak:
    image: klg71/keycloakmigration:0.2.130@sha256:fbec0fbbec2f90e9e912576cfb2ff108fb5703a59383b5e51c8633c130173af8
    depends_on:
      - keycloak
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      BASEURL: http://keycloak:8100/auth
      WAIT_FOR_KEYCLOAK: "true"
      FAIL_ON_UNDEFINED_VARIABLES: "true"
      KEYCLOAK_CHANGELOG: /migration/keycloak-changelog.yml
      EXIT_ON_ERROR: "true"
    volumes:
      - ./keycloak/migration:/migration
    networks:
      - keycloak
    <<: *security_settings

  refarch-gateway:
    image: ghcr.io/it-at-m/refarch/refarch-gateway:1.9.0@sha256:688b8cdd91a59fdedc8e7b36d4b8f7740b0a1020eae7a8a49ab0da6eb9f10f1d
    depends_on:
      init-keycloak:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      ALLOWED_ORIGINS_PUBLIC: http://localhost:*, http://keycloak:8100
      ALLOWED_ORIGINS_CLIENTS: http://localhost:*
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: sso
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://keycloak:8100/
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/api/sso/userinfo
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0: RewritePath=/api/sso/userinfo, /auth/realms/local_realm/protocol/openid-connect/userinfo
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: backend
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://host.docker.internal:8086/
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: Path=/api/ej-app-backend-service/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_FILTERS_0: RewritePath=/api/ej-app-backend-service/(?<urlsegments>.*), /$\{urlsegments}
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: backendonline
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://host.docker.internal:8086/
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: Path=/public/backend/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_FILTERS_0: RewritePath=/public/backend/(?<urlsegments>.*), /$\{urlsegments}
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: backendaenderungsservice
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: http://host.docker.internal:8086/
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: Path=/public/backendaenderungsservice/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_FILTERS_0: RewritePath=/public/backendaenderungsservice/(?<urlsegments>.*), /$\{urlsegments}
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_ID: aenderungsservice
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_URI: http://host.docker.internal:8087/
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_PREDICATES_0: Path=/public/aenderungsservice/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_FILTERS_0: RewritePath=/public/aenderungsservice/(?<urlsegments>.*), /$\{urlsegments}
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_5_ID: online
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_5_URI: http://host.docker.internal:8082/
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_5_PREDICATES_0: Path=/public/online/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_6_ID: eai
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_6_URI: http://host.docker.internal:8085/
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_6_PREDICATES_0: Path=/public/eai/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_6_FILTERS_0: RewritePath=/public/eai/(?<urlsegments>.*), /$\{urlsegments}
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_7_ID: frontend
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_7_URI: http://host.docker.internal:8081/
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_7_PREDICATES_0: Path=/**
      SPRING_PROFILES_ACTIVE: test, hazelcast-local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://keycloak:8100/auth/realms/local_realm
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SSO_ISSUERURI: $${spring.security.oauth2.resourceserver.jwt.issuer-uri}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_PROVIDER: sso
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTID: ej-app
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTSECRET: client_secret
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_SCOPE: profile, openid, roles
      REFARCH_SECURITY_CSRF_WHITELISTED: /public/backendaenderungsservice/**, /public/aenderungsservice/**, /public/eai/**
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ""
    networks:
      - keycloak
    extra_hosts:
      - "host.docker.internal:host-gateway" # Bleibt in Docker
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl http://localhost:8080/actuator/health/liveness"]
    <<: *security_settings

  appswitcher-server:
    image: ghcr.io/it-at-m/appswitcher-server-native:1.3.0@sha256:888d2f1c8ddd59e2e9e84a833cf41cf380cc69e7e54cc10b5bd78378b666a067
    environment:
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/workspace/static
      THC_PATH: /actuator/health/liveness
    ports:
      - "8084:8080"
    volumes:
      - ./appswitcher-server/application.yml:/workspace/config/application.yml
      - ./appswitcher-server/static:/workspace/static
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "/workspace/health-check"]
    <<: *security_settings

  # If the backend is to be started in the Docker-Compose, the following command must be executed at startup:
  # docker-compose --profile=backend up
  # or e.g.:
  # docker-compose --profile=backend --profile=frontend --profile=online --profile=aenderungsservice --profile=eai u
  backend:
    profiles:
      - backend
    image: ghcr.io/it-at-m/ehrenamt-justiz/ehrenamt-justiz-backend:dev@sha256:e530fd95aedbf70d63b143745be7dad9e6135df66cceab193344c0bc9cb7317e
    environment:
      SPRING_PROFILES_ACTIVE: docker,keycloak-permissions
    ports:
      - "8086:8086"
    networks:
      - keycloak
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "curl http://localhost:8086/actuator/health/liveness" ]


  # If the frontend is to be started in the Docker-Compose, the following command must be executed at startup:
  # docker-compose --profile=frontend up
  # or e.g.:
  # docker-compose --profile=backend --profile=frontend --profile=online --profile=aenderungsservice --profile=eai up
  frontend:
    profiles:
      - frontend
    image: ghcr.io/it-at-m/ehrenamt-justiz/ehrenamt-justiz-frontend:dev@sha256:27029b154708a9e9c7380522a1396e539a9889e7b2c4997af17b5b6466bd9af2
    ports:
      - "8081:8080"
    networks:
      - keycloak

  # If the online app is to be started in the Docker-Compose, the following command must be executed at startup:
  # docker-compose --profile=online up
  # or e.g.:
  # docker-compose --profile=backend --profile=frontend --profile=online --profile=aenderungsservice --profile=eai up
  online:
    profiles:
      - online
    image: ghcr.io/it-at-m/ehrenamt-justiz/ehrenamt-justiz-online:dev@sha256:c6bc4ea25b067ea94341e70b53fffd1f67eb218a25795bc42b38750854e5fe85
    ports:
      - "8082:8080"
    networks:
      - keycloak

  # To start the EAI in the local Docker, the script “entrypoint.sh” under ./ehrenamt-justiz-eai must be extended so that
  # the necessary certificates are integrated. See documentation there.
  # If the EAI is to be started in the Docker-Compose, the following command must be executed at startup:
  # docker-compose --profile=eai up
  # or e.g.:
  # docker-compose --profile=backend --profile=frontend --profile=online --profile=aenderungsservice --profile=eai up
  eai:
    profiles:
      - eai
    image: ghcr.io/it-at-m/ehrenamt-justiz/ehrenamt-justiz-eai:dev@sha256:cc404841bbec51c12b7b1f01f430643e17d148ba660c50a9622210de3091b3bd
    volumes:
      - ../ehrenamt-justiz-eai/entrypoint.sh:/usr/local/bin/entrypoint.sh:rwx
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    ports:
      - "8085:8085"
    networks:
      - keycloak
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "curl http://localhost:8085/actuator/health/liveness" ]
    environment:
      PRODUCER_USER:
      PRODUCER_PASSWORD:

  # If the Änderungsservice is to be started in the Docker-Compose, the following command must be executed at startup:
  # docker-compose --profile=aenderungsservice up
  # or e.g.:
  # docker-compose --profile=backend --profile=frontend --profile=online --profile=aenderungsservice --profile=eai up
  aenderungsservice:
    profiles:
      - aenderungsservice
    image: ghcr.io/it-at-m/ehrenamt-justiz/ehrenamt-justiz-aenderungsservice:dev@sha256:40b27cef2e84055fb976c595f8aafb131bef20a7753b900afd700efca5860709
    volumes:
      - ../ehrenamt-justiz-aenderungsservice/src/main/resources/truststore.jks:/etc/ssl/truststore.jks
      - ../ehrenamt-justiz-aenderungsservice/src/main/resources/kafka-auth-keystore.jks:/etc/ssl/kafka-auth-keystore.jks
    depends_on:
      backend:
        condition: service_healthy
      eai:
        condition: service_healthy
    ports:
      - "8087:8087"
    networks:
      - keycloak
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl http://localhost:8087/actuator/health/liveness"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEY_STORE_PASSWORD: changeit
      TRUST_STORE_PASSWORD: changeit
      GROUP_ID: lhm-ewo-eai-aenderungen-ehrenamt-justiz-testDocker00204

networks:
  keycloak: